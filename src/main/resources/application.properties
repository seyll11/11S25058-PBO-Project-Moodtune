spring.application.name=MoodTune
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/moodtune;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=${PORT:8080}
moodtune.gemini.api-key=${GEMINI_API_KEY:}
moodtune.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
moodtune.youtube.api-key=${YOUTUBE_API_KEY:}
