<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Masuk')}"></head>
<body class="login-page">
<main class="login-shell">
  <a class="brand login-brand" th:href="@{/login}">
    <span class="brand-mark">M</span><span>MoodTune<small>music, in your mood</small></span>
  </a>
  <section class="form-card login-card">
    <p class="eyebrow">SELAMAT DATANG KEMBALI</p>
    <h1>Masuk ke MoodTune</h1>
    <p class="subheading">Masuk untuk mengelola koleksi dan playlist musikmu.</p>
    <div class="login-message error-card" role="alert" th:if="${param.error}">
      Username atau password salah.
    </div>
    <div class="login-message notice" role="status" th:if="${param.logout}">
      Kamu sudah keluar dari MoodTune.
    </div>
    <form method="post" th:action="@{/login}">
      <label for="username">Username
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="button primary login-submit" type="submit">Masuk</button>
    </form>
  </section>
  <p class="login-footnote">Akses pribadi · MoodTune</p>
</main>
</body>
</html>
